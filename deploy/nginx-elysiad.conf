# deploy/nginx-elysiad.conf —— elysiad.top 的站点配置（2026-10-16 写，为迁到自建服务器准备）
#
# 为什么这么写：
#   · 这个站是**纯静态**的（HTML/CSS/JS/WebP/JSON），所以 nginx 只做两件事：发文件 + 转发 4 个接口。
#   · 之前的痛点是**跨境链路慢**（实测单页 4~49 秒，连 Cloudflare 缓存都慢）⇒ 搬到自建节点后，
#     再加三样东西把每次往返都榨干：HTTP/3(QUIC)、brotli/gzip、长缓存。
#   · Service Worker 只在 HTTPS 下工作 ⇒ 证书是硬要求，用 Let's Encrypt。
#
# 用法：放到 /etc/nginx/sites-available/elysiad.top 再 ln -s 到 sites-enabled

# ── 静态站 ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;          # HTTP/3（nginx ≥ 1.25）
    http3 on;
    http2 on;

    server_name elysiad.top www.elysiad.top;

    ssl_certificate     /etc/letsencrypt/live/elysiad.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elysiad.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    root /var/www/elysiad;
    index index.html;
    charset utf-8;

    # 打包/压缩：静态资源用 brotli 优先、gzip 兜底
    brotli on;
    brotli_types text/html text/css application/javascript application/json image/svg+xml;
    gzip on;
    gzip_types  text/html text/css application/javascript application/json image/svg+xml;

    # 干净的 URL：/kevin/ → /kevin/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 带指纹的静态资源长期缓存；HTML 与 sw.js **绝不缓存**（否则发版看不到）
    location ~* \.(webp|png|jpg|jpeg|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── 4 个接口：从 Cloudflare Worker 搬过来的（同源，和页面同一条命）──────
    location = /count         { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location = /flower        { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location /notes           { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
}

# ── HTTP 跳 HTTPS（并保留 ACME 的 webroot）────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name elysiad.top www.elysiad.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
