# elysiad.top —— 2026-10-29 备案通过后启用 HTTPS
# 结构：:80 只做 ACME 与 301；:443 才对外提供内容；www 统一跳主域（避免重复内容）
# 证书由 certbot webroot 签发并自动续期（renewal hook: systemctl reload nginx）

# ① 80：ACME 校验 + 全站 301 到 https（IP 直连也跳主域）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ { root /var/www/elysiad; }

    location / { return 301 https://elysiad.top$request_uri; }
}

# ② 443 www：统一跳主域
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.elysiad.top;

    ssl_certificate     /etc/letsencrypt/live/elysiad.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elysiad.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    return 301 https://elysiad.top$request_uri;
}

# ③ 443 主域：真正的站点
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name elysiad.top;

    ssl_certificate     /etc/letsencrypt/live/elysiad.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elysiad.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # CVE-2026-97629（1.28.3-2ubuntu1.12 已打补丁；这里额外关掉票据做纵深防御）
    ssl_session_tickets off;
    # 半年 HSTS（不带 includeSubDomains，留退路；证书自动续期后可再延长）
    add_header Strict-Transport-Security "max-age=15552000" always;

    root /var/www/elysiad;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ $uri/index.html =404; }
    location ~* \.(webp|png|jpg|jpeg|svg|woff2?|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; access_log off; }
    location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public"; }
    location = /sw.js { add_header Cache-Control "no-cache, must-revalidate"; }

    # /v2/ 预览（旁路验证；页面内绝对路径 /assets/… 仍走生产，资源完整性须在本地 public/ 验）
    location ^~ /v2/ { alias /var/www/elysiad-v2/; index index.html; }

    location /api/ { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location = /count  { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location = /flower { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location /notes    { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
}
