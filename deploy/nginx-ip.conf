server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/elysiad;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ $uri/index.html =404; }
    location ~* \.(webp|png|jpg|jpeg|svg|woff2?|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; access_log off; }
    location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public"; }
    location = /sw.js { add_header Cache-Control "no-cache, must-revalidate"; }

    # 4 个接口（Node 后端还没起，先留着；起了就生效）
    # /v2/ 预览（2026-10-18 起）：新架构旁路验证，与生产目录/备份完全隔离。
    # ^~ 强制前缀优先，避免被下面的 .css/.js 正则抢走；页面内是绝对路径 /assets/…，
    # 所以 /v2/ 下资源仍走生产 —— 资源完整性必须在本地 public/ 验证（见重构计划验证矩阵）。
    location ^~ /v2/ { alias /var/www/elysiad-v2/; index index.html; }

    location /api/ { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }

    location = /count  { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location = /flower { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location /notes    { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
}
