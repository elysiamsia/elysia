# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site (whitelist)
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site

          # 站点内容：存在才拷（后续阶段会陆续新增文件，此处不必每次改）
          KEEP_FILES="index.html armor.html 404.html robots.txt sitemap.xml favicon.svg CNAME"
          for f in $KEEP_FILES; do
            [ -e "$f" ] && cp "$f" _site/
          done

          KEEP_DIRS="assets data images aponia eden kalpas kevin su villv sakura kosma guestbook"
          for d in $KEEP_DIRS; do
            [ -e "$d" ] && cp -r "$d" _site/
          done

          # 原始素材不进产物
          rm -rf _site/images/raw

          # 白名单自检：以下路径一旦出现在产物里就让构建失败
          fail=0
          for p in tools docs .github worker screenshots .superpowers "images/raw" node_modules; do
            if [ -e "_site/$p" ]; then
              echo "::error::不该被部署的路径进了产物: $p"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          echo "=== 产物清单 ==="
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
