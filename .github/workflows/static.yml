name: 部署到生产（构建版）
# 2026-10-18 切换：线上 :80 改为「构建 → public/ → 原子替换」。
#
# 与旧版的差别：
#   · 源头从「仓库根按白名单装配」改为 **npm run build 的产物 public/**（手写页已退役）；
#   · 构建用 --strict-templates：12 个角色页缺模板零件会**直接失败**（防止静默走拷贝路径）；
#   · 传输量自检 + 三页 200 自检；备份目录 .prev 支持秒回滚。
#
# ⚠ KEEP_FILES / KEEP_DIRS 两行**必须保留**：src/build/build.mjs 从本文件读它们作为拷贝白名单。
# 2026-11-03 分支模型：main = 全功能版（GitHub Pages），server = 线上合规版。
# 生产只由 server 触发；main 上的同名文件已改成仅 workflow_dispatch（推 main 不再上线）。
on:
  push:
    branches: [server]
  workflow_dispatch:

env:
  # 404.html 已由模板生成（content/pages/404.json + templates/pages/404.page.*），不再从这里拷
  KEEP_FILES: "index.html sw.js armor.html robots.txt sitemap.xml favicon.svg CNAME"
  KEEP_DIRS: "assets data images aponia eden kalpas kevin su villv sakura kosma mobius griseo hua pardofelis"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 2026-11-03 事故：run 41583003255 卡在 scp 上传 36 分钟（连接静默挂死，OpenSSH 默认永不超时）。
    # 连接级硬化 + 作业级上限：让「连不上」在几分钟内变成一次明确的 failure，而不是挂满 6 小时。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: 构建（严格模式）
        run: npm run build -- --strict-templates
      - name: 产物自检
        run: |
          set -euo pipefail
          for p in index.html kevin/index.html su/index.html hua/index.html; do
            test -s "public/$p" || { echo "缺产物 $p"; exit 1; }
          done
          n=$(find public -type f | wc -l)
          echo "产物文件数 $n"
          [ "$n" -gt 100 ] || { echo "产物太少，可能漏拷"; exit 1; }
      - name: 上传并原子替换
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: 1.14.60.153
          USER: ubuntu
          # 建连 20s 超时；空闲 15s 探不到响应、连探 4 次就断开
          SSH_OPTS: -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf "%s\n" "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          n=$(find public -type f | wc -l)
          echo "本地产物 $n 个文件"
          [ "$n" -ge 100 ] || { echo "产物过少，放弃发布"; exit 1; }

          tar czf /tmp/elysia-deploy.tgz -C public .
          ls -lh /tmp/elysia-deploy.tgz

          # 先上传，再在服务器上核对包大小（2026-10-23 事故：包没送到就清了线上目录）
          scp $SSH_OPTS -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new /tmp/elysia-deploy.tgz "$USER@$HOST:/tmp/elysia-deploy.tgz"
          LOCAL=$(stat -c %s /tmp/elysia-deploy.tgz)
          REMOTE=$(ssh $SSH_OPTS -i ~/.ssh/id_deploy "$USER@$HOST" 'stat -c %s /tmp/elysia-deploy.tgz 2>/dev/null || echo 0')
          echo "包大小 本地=${LOCAL} 远端=${REMOTE}"
          [ "$LOCAL" = "$REMOTE" ] || { echo "❌ 上传不完整或失败 —— 线上未动"; exit 1; }

          # 发布逻辑在仓库里（deploy/remote-release.sh），CI 与本地共用同一份
          scp $SSH_OPTS -i ~/.ssh/id_deploy deploy/remote-release.sh "$USER@$HOST:/tmp/remote-release.sh"
          ssh $SSH_OPTS -i ~/.ssh/id_deploy "$USER@$HOST" 'WEBROOT=/var/www/elysiad bash /tmp/remote-release.sh'
      - name: 线上自检
        run: |
          set -euo pipefail
          # ⚠ 2026-11-03 修正：原来打 http://1.14.60.153（Host 是 IP），nginx 对非 elysiad.top 的
          # Host 一律 301 到 https，于是这条自检**永远是 301 ≠ 200**、发布明明成功也报红。
          # 改成直接打正式域名（顺带把 https 也验了）。
          for p in / /kevin/ /su/ /hua/; do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://elysiad.top$p?cb=$RANDOM")
            echo "$p → $code"
            [ "$code" = "200" ] || exit 1
          done
          # 备案下线的东西必须真的不在线上
          for p in /guestbook/ /count; do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://elysiad.top$p?cb=$RANDOM")
            echo "$p → $code（应为 404）"
            [ "$code" = "404" ] || exit 1
          done
