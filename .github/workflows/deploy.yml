name: 部署到自建服务器
# 2026-10-16：从 Cloudflare Pages 迁到自建服务器（四川轻量云）。
#
# 为什么不用「服务器自己 git pull」：
#   实测服务器连 GitHub 时 **curl -I 1.66 秒能过、git clone 传大文件必被掐**
#   （fatal: GnuTLS recv error (-110): The TLS connection was non-properly terminated）。
#   ⇒ 让 **Actions 推、服务器只收**，服务器完全不需要访问 GitHub。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里加：
#   SSH_KEY   服务器私钥的**全文**（就是本地那把 .pem 的内容，含 BEGIN/END 两行）
#   （SSH_HOST / SSH_USER 不是秘密，直接写在这里）
on:
  push:
    branches: [main]
  workflow_dispatch:        # 也可以手动点一下重发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 白名单装配：与 static.yml 里的 KEEP_* 保持一致（**两处都要改**）
      - name: 装配（只挑该发布的）
        run: |
          KEEP_FILES="index.html sw.js armor.html 404.html robots.txt sitemap.xml favicon.svg CNAME"
          KEEP_DIRS="assets data images aponia eden kalpas kevin su villv sakura kosma mobius griseo hua pardofelis guestbook"
          mkdir -p /tmp/stage
          for f in $KEEP_FILES; do [ -e "$f" ] && cp -r "$f" /tmp/stage/; done
          for d in $KEEP_DIRS;  do [ -d "$d" ] && cp -r "$d" /tmp/stage/; done
          tar czf /tmp/site.tgz -C /tmp/stage .
          echo "文件数：$(find /tmp/stage -type f | wc -l)"

      - name: 推送到服务器
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: 1.14.60.153
          USER: ubuntu
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new /tmp/site.tgz "$USER@$HOST:/tmp/site.tgz"
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
            set -e
            WEB=/var/www/elysiad
            sudo mkdir -p $WEB && sudo chown ubuntu:ubuntu $WEB
            sudo rm -rf $WEB.prev && sudo cp -a $WEB $WEB.prev
            find $WEB -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar xzf /tmp/site.tgz -C $WEB
            rm -f /tmp/site.tgz
            echo "已发布：$(find $WEB -type f | wc -l) 个文件"
          REMOTE
