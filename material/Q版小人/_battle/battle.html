<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>赛博斗蛐蛐 · 战斗样板</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#0e0f13;color:#eee;font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif}
 #c{position:fixed;inset:0;width:100%;height:100%}
 .hp{position:fixed;top:26px;width:34%;height:14px;background:#22242c;border:1px solid #3a3d47;border-radius:8px;overflow:hidden}
 .hp i{display:block;height:100%;background:linear-gradient(90deg,#7be0a0,#3fbf7f);transition:width .18s}
 #hpL{left:4%} #hpR{right:4%}
 #hpR i{background:linear-gradient(90deg,#ff9f8f,#e0604f);float:right}
 .nm{position:fixed;top:6px;font-size:12px;opacity:.85}
 #nmL{left:4%} #nmR{right:4%}
 #time{position:fixed;left:50%;top:10px;transform:translateX(-50%);opacity:.5;font-size:12px}
 #bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px}
 button{background:#24262e;color:#ddd;border:1px solid #3a3d47;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="nm" id="nmL">格蕾修</div><div class="nm" id="nmR">爱莉希雅</div>
<div class="hp" id="hpL"><i style="width:100%"></i></div>
<div class="hp" id="hpR"><i style="width:100%"></i></div>
<div id="time"></div>
<div id="bar"><button id="play">▶ 播放</button><button id="reset">重来</button></div>
<script src="spine-webgl.js"></script>
<script>
const BASE = location.pathname.replace(/battle\.html$/, '');
const canvas = document.getElementById('c');
const ctx = new spine.ManagedWebGLRenderingContext(canvas, { alpha: false });
const shader = spine.Shader.newTwoColoredTextured(ctx);
const batcher = new spine.PolygonBatcher(ctx);
const mvp = new spine.Matrix4();
const renderer = new spine.SkeletonRenderer(ctx);
const WORLD = { x0: -420, y0: -30, w: 860, h: 560 };

function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }
async function loadFile(url, json){ 
  const r = await fetch(url);
  return json ? r.json() : new Uint8Array(await r.arrayBuffer());
}
async function loadModel(dir, name, isJson){
  const base = dir + '/';
  const atlasText = await (await fetch(base + encPath(name + '.atlas'))).text();
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = base + encPath(name + '.png'); });
  const tex = new spine.GLTexture(ctx, img);
  const atlas = new spine.TextureAtlas(atlasText);
  for (const p of atlas.pages) p.setTexture(tex);
  const loader = new spine.AtlasAttachmentLoader(atlas);
  let data;
  if (isJson) data = new spine.SkeletonJson(loader).readSkeletonData(await loadFile(base + name + '.json', true));
  else data = new spine.SkeletonBinary(loader).readSkeletonData(await loadFile(base + name + '.skel', false));
  const sk = new spine.Skeleton(data);
  sk.setToSetupPose(); sk.updateWorldTransform();
  const off = new spine.Vector2(), size = new spine.Vector2();
  sk.getBounds(off, size, []);
  const state = new spine.AnimationState(new spine.AnimationStateData(data));
  return { sk, state, atlas, tex, bounds: { x: off.x, y: off.y, w: size.x, h: size.y } };
}

// 战斗脚本（秒）
const SCRIPT = [
  { t: 0.00, who: 'L', anim: 'enter' },
  { t: 0.55, who: 'L', anim: 'idle' },
  { t: 1.10, who: 'L', anim: 'attack' },
  { t: 1.34, who: 'R', anim: '@hit',  hp: 88 },
  { t: 1.90, who: 'R', anim: '1_idle' },
  { t: 2.20, who: 'R', anim: '5_special_ani' },
  { t: 2.55, who: 'L', anim: 'hit',   hp: 90 },
  { t: 3.10, who: 'L', anim: 'idle' },
  { t: 3.40, who: 'L', anim: 'cast' },
  { t: 4.05, who: 'R', anim: '@ko',   hp: 0 },
  { t: 4.90, who: 'L', anim: 'win' },
];
const T_END = 6.4;

let L, R, t = 0, playing = false;
let hpL = 100, hpR = 100;

function applyAction(unit, anim, localT){
  if (!unit) return;
  if (anim === '@hit') {
    unit.state.setAnimation(0, unit.data.anims.idle, true);
    unit.state.update(0); unit.state.apply(unit.sk);
    unit.sk.x = unit.base.x + Math.sin(localT*40) * 14 * Math.max(0, 1 - localT*2.2);
    unit.tint = Math.max(0, 1 - localT*3);
    return;
  }
  if (anim === '@ko') {
    unit.state.setAnimation(0, unit.data.anims.idle, true);
    unit.state.update(0); unit.state.apply(unit.sk);
    const k = Math.min(1, localT / 0.55);
    unit.sk.bones[0].rotation = -90 * k;
    unit.sk.y = unit.base.y - 20 * k;
    return;
  }
  if (unit.anims && unit.anims.has(anim)) {
    unit.state.setAnimation(0, anim, anim === 'idle' || anim === '1_idle');
    unit.state.update(localT); unit.state.apply(unit.sk);
  }
}
function seek(time){
  t = time;
  for (const u of [L, R]) { if (!u) continue; u.sk.x = u.base.x; u.sk.y = u.base.y; u.sk.bones[0].rotation = 0; u.tint = 0; }
  let lastL = { anim: 'idle', start: 0 }, lastR = { anim: '1_idle', start: 0 };
  hpL = 100; hpR = 100;
  for (const ev of SCRIPT) {
    if (ev.t > time) break;
    if (ev.who === 'L') lastL = { anim: ev.anim, start: ev.t };
    else lastR = { anim: ev.anim, start: ev.t };
    if (ev.hp !== undefined) { if (ev.who === 'L') hpL = ev.hp; else hpR = ev.hp; }
  }
  if (L) applyAction(L, lastL.anim, time - lastL.start);
  if (R) applyAction(R, lastR.anim, time - lastR.start);
  document.getElementById('hpL').firstElementChild.style.width = hpL + '%';
  document.getElementById('hpR').firstElementChild.style.width = hpR + '%';
  document.getElementById('time').textContent = 't=' + time.toFixed(2) + 's';
}
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  // 等比例铺满
  const scale = Math.max(WORLD.w / w, WORLD.h / h);
  const vw = w * scale, vh = h * scale;
  const cx = WORLD.x0 + WORLD.w / 2, cy = WORLD.y0 + WORLD.h / 2;
  mvp.ortho2d(cx - vw/2, cy - vh/2, vw, vh);
  ctx.gl.viewport(0, 0, canvas.width, canvas.height);
}
function drawUnit(u){
  u.state.apply(u.sk);
  u.sk.updateWorldTransform();
  renderer.draw(batcher, u.sk);
}
let lastT = performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  resize();
  const gl = ctx.gl;
  gl.clearColor(0.055,0.06,0.075,1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (playing) {
    t += dt;
    if (t > T_END) { playing = false; document.getElementById('play').textContent = '▶ 重播'; }
    seek(t);
  }
  shader.bind(); shader.setUniformi(spine.Shader.SAMPLER, 0);
  shader.setUniform4x4f(spine.Shader.MVP_MATRIX, mvp.values);
  batcher.begin(shader);
  for (const u of [L, R]) if (u) drawUnit(u);
  batcher.end(); shader.unbind();
}
async function boot(){
  L = await loadModel(BASE + '../格蕾修/Spine 骨骼动画模型/griseo', 'griseo', true);
  R = await loadModel(BASE + '../爱莉希雅/Spine 骨骼动画模型/01_爱神使者_主色', 'elvisa_1', false);
  // 统一身高、落地、左右站位
  const norm = (u, targetH) => {
    const s = targetH / u.bounds.h;
    u.sk.scaleX = s; u.sk.scaleY = s;
    u.sk.x = -u.bounds.x * s;  // 先归零
    u.sk.y = -u.bounds.y * s;
    u.baseScale = s;
    return s;
  };
  const sL = norm(L, 470), sR = norm(R, 470);
  L.sk.x = -230 - (L.bounds.x + L.bounds.w/2) * sL;
  R.sk.x =  230 - (R.bounds.x + R.bounds.w/2) * sR;
  R.sk.scaleX = -sR;
  L.base = { x: L.sk.x, y: L.sk.y };
  R.base = { x: R.sk.x, y: R.sk.y };
  L.anims = new Set(L.sk.data.animations.map(a => a.name));
  R.anims = new Set(R.sk.data.animations.map(a => a.name));
  L.data = { anims: { idle: L.anims.has('idle') ? 'idle' : '1_idle' } };
  R.data = { anims: { idle: '1_idle' } };
  document.getElementById('play').onclick = () => { playing = true; t = 0; seek(0); };
  document.getElementById('reset').onclick = () => { playing = false; seek(0); };
  const q = new URLSearchParams(location.search);
  if (q.get('ui') === '0') document.getElementById('bar').style.display = 'none';
  seek(parseFloat(q.get('t') || '0'));
  if (q.get('play') === '1') { playing = true; }
  requestAnimationFrame(loop);
}
boot().catch(e => {
  const msg = (e && (e.stack || e.message)) || String(e);
  document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f88;position:fixed;bottom:0;left:0;right:0;background:#000;padding:8px;white-space:pre-wrap">'+msg+'</pre>');
});
</script>
</body></html>
