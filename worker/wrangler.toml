name = "elysia-flowers"
main = "src/index.js"
compatibility_date = "2026-09-15"

# 自定义域名。因为 elysiad.top 的 DNS 已在 Cloudflare，这一行会自动建好解析记录
# ⚠ 实测：默认的 *.workers.dev 在中国大陆连不上（HTTP 000），必须用自定义域名
#
# ⚠ 第二条路由把 /notes* 挂到**主站同源**上。
#   为什么：页面在 elysiad.top、接口原本在 flowers.elysiad.top，是**两个不同的域名**。
#   实测有访客（手机网络）页面能打开、接口整个连不上——两个域名 = 两条独立的命。
#   改成同源后，**只要页面能打开，接口就一定能连上**，而且不用跨域、
#   不用发预检请求、少一次 DNS 解析。
#
# ⚠ 后两条（/count、/flower）是 2026-09-16 补的。留言簿当年改同源时，献花漏了——
#   后果是 QQ 浏览器上点献花永远显示「你的花已送达 · 本机累计 N 朵」，
#   而页面看起来完全正常（降级是静默的，设计如此），所以没人发现。
#   需求方手机实拍：QQ 浏览器「本机累计 3 朵」 vs 桌面浏览器「这里已收到 7 朵花」。
#   只加这两条就够了，**不要**改成 `elysiad.top/*`——那会把整站静态页面也吞进 Worker。
# ⚠ 2026-11-03：主域名换成 elysia.biz（全功能版，静态在 Cloudflare Pages 上）。
#   elysiad.top 的 zone 已不在 Cloudflare（NS 在 DNSPod），旧四条路由全部失效。
#   仍然**只挂接口路径**，不要写成 elysia.biz/* —— 那会把整站静态页面也吞进 Worker。
routes = [
  { pattern = "elysia.biz/notes*", zone_name = "elysia.biz" },
  { pattern = "elysia.biz/count", zone_name = "elysia.biz" },
  { pattern = "elysia.biz/flower", zone_name = "elysia.biz" }
]

# 写入总闸。「只搭管道、先不开放写入」（需求方 2026-11-03 定）。
# 关着时 /flower 与 POST /notes 返回 503 + {ok:false,reason:"readonly"}，前端显示「暂未开放」；
# GET /count、GET /notes 照常可读。要开放：改成 "true" 再 wrangler deploy，前端一行不用动。
[vars]
WRITES_ENABLED = "false"

# 献花计数
[[kv_namespaces]]
binding = "FLOWERS"
id = "e2d964f0af9f4863820bcfa20a5aac7e"

# 匿名花笺的留言存储
# ⚠ D1 的主区域在**创建时**就定死了，建错了只能删库重建：
#     wrangler d1 create elysia-notes --location apac
#   （首次误建到 EEUR，已删除重建到 APAC）
[[d1_databases]]
binding = "NOTES_DB"
database_name = "elysia-notes"
database_id = "7683cdcf-0897-46d2-9e5a-14a3fb0a7394"
